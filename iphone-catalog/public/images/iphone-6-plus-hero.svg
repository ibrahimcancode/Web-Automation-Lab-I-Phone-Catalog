<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f0f5"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c0c4"/>
      <stop offset="30%" stop-color="#d0d0d4"/>
      <stop offset="70%" stop-color="#b0b0b4"/>
      <stop offset="100%" stop-color="#a0a0a4"/>
    </linearGradient>
    
    <linearGradient id="screenBg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="screenContent" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="302" y="112" width="196" height="360" rx="2"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="800" y2="200" stroke="#000" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#000" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="#000" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="800" stroke="#000" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="800" stroke="#000" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#000" stroke-width="0.5"/>
  </g>

  <!-- Phone body group with shadow -->
  <g filter="url(#shadow)">
    <!-- Frame -->
    <rect x="284" y="68" width="232" height="500" rx="24" fill="url(#frame)" stroke="#9a9aa0" stroke-width="1"/>

    <!-- Frame highlights (left edge) -->
    <rect x="284" y="88" width="2" height="460" rx="1" fill="#e8e8ec" opacity="0.5"/>

    <!-- Side buttons -->
    <rect x="280" y="138" width="4" height="28" rx="2" fill="#a0a0a4"/>
    <rect x="280" y="178" width="4" height="40" rx="2" fill="#a0a0a4"/>
    <rect x="280" y="226" width="4" height="40" rx="2" fill="#a0a0a4"/>
    <rect x="516" y="178" width="4" height="48" rx="2" fill="#a0a0a4"/>

    <!-- Screen -->
    <rect x="292" y="112" width="216" height="360" rx="2" fill="url(#screenBg)"/>

    <!-- Screen content -->
    <g clip-path="url(#screenClip)">
      <rect x="302" y="112" width="196" height="360" fill="url(#screenContent)"/>

      <!-- Status bar -->
      <text x="316" y="130" font-family="-apple-system,sans-serif" font-size="9" fill="#fff" opacity="0.7">9:41</text>

      
      <!-- Top bezel (thick, with speaker and camera) -->
      <rect x="292" y="76" width="216" height="36" rx="0" fill="#1a1a1a"/>
      <!-- Speaker grille -->
      <rect x="378" y="88" width="44" height="3" rx="1.5" fill="#333"/>
      <!-- Front camera -->
      <circle cx="478" cy="93" r="4" fill="#222" stroke="#333" stroke-width="0.5"/>
      <circle cx="478" cy="93" r="2" fill="#1a1a2e"/>

      <!-- Model name -->
      <text x="400" y="210" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="-0.5">iPhone</text>
      <text x="400" y="245" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="36" font-weight="800" fill="#fff" letter-spacing="-1">Plus</text>

      <!-- Accent -->
      <rect x="352" y="260" width="96" height="2" rx="1" fill="#FF9500"/>

      <!-- Feature chips -->
      <g transform="translate(318, 290)">
        <rect x="0" y="0" width="164" height="28" rx="14" fill="#FF9500" opacity="0.2"/>
        <text x="82" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" fill="#FF9500">A8 · Single</text>
      </g>
      <g transform="translate(318, 326)">
        <rect x="0" y="0" width="164" height="28" rx="14" fill="#FF9500" opacity="0.15"/>
        <text x="82" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" fill="#FF9500">5.5" IPS LCD</text>
      </g>

      <!-- Bottom specs -->
      <text x="400" y="432" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#fff" opacity="0.4">5.5" · Aluminum · 8MP</text>

      <!-- Bottom bezel with Home button -->
      <rect x="292" y="472" width="216" height="96" rx="0" fill="#1a1a1a"/>
      <!-- Home button ring -->
      <circle cx="400" cy="520" r="16" fill="none" stroke="#555" stroke-width="1.5"/>
      <!-- Home button -->
      <circle cx="400" cy="520" r="12" fill="#222" stroke="#333" stroke-width="0.5"/>
    </g>

    <!-- Screen edge reflections -->
    <rect x="292" y="112" width="216" height="360" rx="2" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Tier badge -->
  <rect x="340" y="620" width="120" height="32" rx="16" fill="#FF9500"/>
  <text x="400" y="641" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#fff">Plus</text>

  <!-- Model label -->
  <text x="400" y="680" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">iPhone 6 Plus</text>
  <text x="400" y="705" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#888">2014 · From $299</text>

  <!-- Reflection line on frame -->
  <line x1="298" y1="88" x2="298" y2="548" stroke="#fff" stroke-width="1" opacity="0.15"/>
</svg>