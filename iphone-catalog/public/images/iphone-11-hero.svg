<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f0f5"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c0c4"/>
      <stop offset="30%" stop-color="#d0d0d4"/>
      <stop offset="70%" stop-color="#b0b0b4"/>
      <stop offset="100%" stop-color="#a0a0a4"/>
    </linearGradient>
    
    <linearGradient id="screenBg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="screenContent" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="40%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="296" y="92" width="208" height="456" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="800" y2="200" stroke="#000" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#000" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="#000" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="800" stroke="#000" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="800" stroke="#000" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#000" stroke-width="0.5"/>
  </g>

  <!-- Phone body group with shadow -->
  <g filter="url(#shadow)">
    <!-- Frame -->
    <rect x="280" y="60" width="240" height="520" rx="28" fill="url(#frame)" stroke="#9a9aa0" stroke-width="1"/>

    <!-- Frame highlights (left edge) -->
    <rect x="280" y="80" width="2" height="480" rx="1" fill="#e8e8ec" opacity="0.5"/>

    <!-- Side buttons -->
    <rect x="276" y="140" width="4" height="28" rx="2" fill="#a0a0a4"/>
    <rect x="276" y="180" width="4" height="40" rx="2" fill="#a0a0a4"/>
    <rect x="276" y="232" width="4" height="40" rx="2" fill="#a0a0a4"/>
    <rect x="520" y="180" width="4" height="52" rx="2" fill="#a0a0a4"/>

    <!-- Screen -->
    <rect x="288" y="68" width="224" height="504" rx="20" fill="url(#screenBg)"/>

    <!-- Screen content -->
    <g clip-path="url(#screenClip)">
      <rect x="296" y="92" width="208" height="456" fill="url(#screenContent)"/>

      <!-- Status bar -->
      <text x="310" y="110" font-family="-apple-system,sans-serif" font-size="9" fill="#fff" opacity="0.7">9:41</text>

      
      <!-- Notch -->
      <rect x="356" y="92" width="88" height="22" rx="11" fill="#000"/>
      <circle cx="390" cy="103" r="3.5" fill="#1a1a2e" stroke="#2a2a3e" stroke-width="0.5"/>
      <circle cx="410" cy="103" r="2" fill="#1a1a2e"/>

      <!-- Model name -->
      <text x="400" y="180" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#fff" letter-spacing="-1">iPhone</text>
      <text x="400" y="220" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="42" font-weight="900" fill="#fff" letter-spacing="-1.5"></text>

      <!-- Accent ring -->
      <circle cx="400" cy="270" r="20" fill="none" stroke="#007AFF" stroke-width="2" opacity="0.6"/>

      <!-- Face ID icon -->
      <g transform="translate(388, 258)" opacity="0.7">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="none" stroke="#fff" stroke-width="1.5"/>
        <circle cx="12" cy="10" r="3" fill="none" stroke="#fff" stroke-width="1"/>
        <path d="M6 18 Q12 14 18 18" fill="none" stroke="#fff" stroke-width="1"/>
      </g>

      <!-- Feature chips -->
      <g transform="translate(310, 320)">
        <rect x="0" y="0" width="180" height="28" rx="14" fill="#007AFF" opacity="0.2"/>
        <text x="90" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" font-weight="600" fill="#007AFF">Face ID · IPS LCD · A13 Bionic</text>
      </g>

      <!-- Bottom specs -->
      <text x="400" y="498" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="9" fill="#fff" opacity="0.4">6.1" · Aluminum and Glass · 12MP</text>

      <!-- Home indicator -->
      <rect x="370" y="518" width="60" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
    </g>

    <!-- Screen edge reflections -->
    <rect x="288" y="68" width="224" height="504" rx="20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Tier badge -->
  <rect x="340" y="620" width="120" height="32" rx="16" fill="#007AFF"/>
  <text x="400" y="641" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#fff">Standard</text>

  <!-- Model label -->
  <text x="400" y="680" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">iPhone 11</text>
  <text x="400" y="705" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" fill="#888">2019 · From $499</text>

  <!-- Reflection line on frame -->
  <line x1="292" y1="80" x2="292" y2="560" stroke="#fff" stroke-width="1" opacity="0.15"/>
</svg>